<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Utsav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="index.html">✦ Utsav</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="random.html">Random Event</a>
        <a class="active" href="contact.html">Contact</a>
        <a href="admin.html">Admin / Upload</a>
      </div>
    </nav>
  </header>

  <main class="container page-main">
    <section class="page-heading">
      <p class="eyebrow">We would love to hear from you</p>
      <h1>Get in touch</h1>
      <p>Send a question or suggestion to the fest team.</p>
    </section>

    <section class="form-card narrow-card">
      <form id="contact-form" action="thankyou.html" novalidate>
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" required>

        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" required>

        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" required></textarea>

        <p id="contact-error" class="form-message error" role="alert"></p>
        <button class="button button-primary" type="submit">Send message</button>
        <p class="small-note">This demo validates your message in the browser; it does not email or save it.</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <a class="brand" href="index.html">✦ Utsav</a>
      <p>Made for campus, by campus. <span id="current-year"></span></p>
    </div>
  </footer>
</body>
</html>
